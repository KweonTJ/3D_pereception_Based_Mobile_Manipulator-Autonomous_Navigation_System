mp_control_node:
  ros__parameters:
    bbox_topic: /target/tracked_bbox
    fallback_bbox_topic: /target/init_bbox
    eef_bbox_topic: /target/eef_tracked_bbox
    eef_init_bbox_topic: /target/eef_init_bbox
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info_calibrated
    eef_camera_info_topic: /eef_camera/camera_info
    eef_auto_init_enable_topic: /target/eef_auto_init_enable
    base_hold_topic: /target/base_hold
    close_range_ready_topic: /target/close_range_ready
    stable_object_topic: /target/object_in_base

    twist_topic: /servo_node/delta_twist_cmds
    base_cmd_vel_topic: /cmd_vel
    joint_state_topic: /joint_states
    # Send pregrasp trajectories through the same joint3 delta-mirror
    # transformer as MoveIt Servo. The transformer publishes to the real
    # /arm_controller/joint_trajectory topic.
    joint_trajectory_topic: /arm_controller/joint_trajectory_raw
    # Handoff is already expressed in real controller joint coordinates.
    # Bypass the joint3 mirror transformer so close -> joint1 turn does not
    # re-command joint2/joint3 through stale raw targets.
    handoff_joint_trajectory_topic: /arm_controller/joint_trajectory
    gripper_action_name: /gripper_controller/gripper_cmd
    start_topic: /mp_control/start
    cancel_topic: /mp_control/cancel
    status_topic: /mp_control/status
    cargo_event_topic: /cargo/events
    cargo_current_id_topic: /cargo/current_id
    cargo_id_prefix: PKG
    cargo_sequence_start: 1

    target_frame: base_link
    end_effector_frame: end_effector_link
    # Pose diagnostics and roll-control frame selection.
    # link5 is the joint4 child side before the gripper jaws, while
    # end_effector_link is the gripper-center control frame used for RPY hold.
    joint4_pose_frame: link5
    gripper_pose_frame: end_effector_link
    camera_frame_override: ""
    eef_camera_frame_override: eef_usb_camera_optical_frame

    auto_start: false
    auto_start_on_bbox: true
    # Use YOLO init bbox as a close-range fallback when CSRT tracked bbox stalls.
    # This keeps the handoff/pregrasp logic alive after the front depth limit.
    use_fallback_bbox_for_control: true
    start_servo_on_start: false
    open_gripper_on_start: true
    close_gripper_on_arrival: true
    # Gripper close is triggered only after the front camera object becomes
    # occluded/missing and the EEF camera also loses the object because it is
    # too close. Handoff starts right after that visual close trigger.
    require_visual_grasp_confirmation: false
    use_eef_refinement: true
    wait_for_base_approach: true
    auto_init_eef_tracker_from_object: false
    use_depthless_triangulation: true
    use_color_triangulation_after_min_depth: true
    require_close_range_ready_for_pregrasp: true
    # Real hardware pregrasp bypasses Cartesian Servo because Servo collision
    # scaling can stall while the arm is still mechanically able to extend.
    use_joint_pregrasp: true

    command_rate_hz: 20.0
    max_target_age_s: 2.0
    close_range_ready_max_age_s: 2.0
    linear_gain: 1.4
    max_linear_speed: 0.08
    position_tolerance_m: 0.035
    close_after_stable_cycles: 4
    grasp_completion_front_max_age_s: 2.0
    grasp_completion_eef_lost_timeout_s: 0.8

    depth_roi_radius_px: 5
    depth_unit_scale: 0.001
    min_valid_depth_m: 0.47
    max_valid_depth_m: 1.0
    depth_std_max_m: 0.08
    depth_min_fill_ratio: 0.25
    depth_jump_limit_m: 0.10
    stable_depth_frames: 3
    min_depth_samples: 30

    # Offset is applied in target_frame after the camera point is transformed.
    # Tune these slowly if the gripper consistently stops beside/above/in front of the object.
    grasp_offset_x: 0.0
    grasp_offset_y: 0.0
    grasp_offset_z: 0.0

    # Real EEF refinement/triangulation requires calibrated camera_info from v4l2_camera.
    # Keep fallback disabled so a missing calibration file is visible during real tests.
    allow_eef_camera_info_fallback: true
    eef_camera_fallback_width_px: 320
    eef_camera_fallback_height_px: 240
    eef_camera_fallback_fx: 554.0
    eef_camera_fallback_fy: 554.0
    eef_refinement_switch_distance_m: 0.12
    eef_refinement_start_depth_m: 0.47
    # Start EEF YOLO before Astra depth is ignored so a fresh bbox is ready at 0.47 m.
    eef_yolo_pre_enable_depth_m: 0.60
    min_depth_handoff_margin_m: 0.02
    # If the Astra depth is already unreliable but the front YOLO box fills the
    # image this much, treat it as close-range handoff instead of waiting.
    min_depth_handoff_bbox_area_ratio: 0.08
    min_depth_handoff_bbox_height_ratio: 0.40
    # Front depth is trusted only until 0.47 m. Once that near limit is reached,
    # depth is ignored and front RGB + EEF RGB triangulation keeps the base
    # approaching until color_triangulation_base_stop_object_x_m.
    eef_refinement_start_object_x_m: 0.22
    arm_start_max_error_m: 0.50
    arm_start_max_object_x_m: 0.22
    object_height_m: 0.10
    eef_init_bbox_min_size_px: 32.0
    eef_init_bbox_max_size_px: 180.0
    eef_init_bbox_padding_scale: 1.6
    eef_init_bbox_republish_period_s: 0.5
    eef_final_depth_m: 0.08
    object_pregrasp_standoff_m: 0.06
    object_pregrasp_min_z_m: 0.50
    object_pregrasp_lower_standoff_m: 0.02
    object_pregrasp_min_lower_z_m: 0.12
    object_pregrasp_enable_lowering: false
    # Keep the shoulder higher than the old pregrasp pose so the arm does not
    # drop into the front Astra camera view before close-range EEF alignment.
    pregrasp_ready_joint_positions: [0.0, 1.2, -2.65, -0.55]
    # Keep the gripper parallel to the base/body in the pregrasp command.
    # The real arm's gripper-side orientation changes with joint2+joint3+joint4;
    # excluding joint3 makes the gripper point upward when the arm extends.
    # The real trajectory transformer must only mirror joint3; joint4 roll
    # compensation is intentionally kept here to avoid applying it twice.
    pregrasp_preserve_gripper_roll: true
    pregrasp_roll_joint2_weight: 1.0
    pregrasp_roll_joint3_weight: 1.0
    pregrasp_roll_joint4_weight: 1.0
    # pregrasp_ready_joint_positions is the desired controller-side final pose.
    # mp_control pre-inverts joint3 on the raw topic so the downstream
    # joint_trajectory_transformer.py can mirror it back to this target while
    # preserving the real hardware's required joint3 command direction.
    pregrasp_reverse_joint3_delta: true
    pregrasp_hold_current_duration_s: 0.0
    pregrasp_move_duration_s: 1.4
    # Move joint3 first before lowering joint2. The node now creates small
    # controller-side joint3 step targets before joint2/joint4 are allowed to
    # move, so the old raw-space lead waypoint is disabled.
    pregrasp_joint2_max_step_rad: 0.06
    pregrasp_joint3_max_step_rad: 0.17
    pregrasp_joint4_max_step_rad: 0.02
    pregrasp_joint3_lead_enabled: false
    pregrasp_joint3_lead_duration_ratio: 0.45
    pregrasp_joint3_lead_fraction: 0.25
    # Keep this as 1 after the joint3 lead point; extra interpolation can make
    # the arm look like it is stepping through joint2 -> joint3 -> joint4.
    pregrasp_sync_steps: 1
    pregrasp_settle_s: 0.5
    pregrasp_joint_tolerance_rad: 0.04
    pregrasp_republish_period_s: 1.0
    pregrasp_joint_min_positions: [-3.14, -1.5, -2.70, -1.79]
    pregrasp_joint_max_positions: [3.14, 1.5, 1.38, 2.04]
    eef_center_tolerance_px: 28.0
    eef_close_tolerance_px: 70.0
    eef_depth_tolerance_m: 0.018
    eef_refine_lateral_gain: 0.8
    eef_refine_depth_gain: 0.5
    eef_refine_max_linear_speed: 0.03
    # EEF refinement keeps the current EE roll/pitch/yaw while nudging the
    # hand forward after the bbox is aligned, then closes the gripper.
    use_eef_rpy_refinement: true
    eef_hold_current_rpy: true
    # Keep the roll angle captured from the initial stay pose. Pitch/yaw are
    # still held from the refinement entry pose so pregrasp can remain natural.
    eef_hold_stay_roll: false
    eef_rpy_tolerance_rad: 0.12
    eef_rpy_gain: 0.8
    eef_refine_max_angular_speed: 0.25
    eef_forward_after_align: true
    eef_forward_distance_m: 0.08
    eef_forward_speed_mps: 0.028
    # Real grasp sequence: stop base, build pregrasp pose, advance the EEF by
    # distance instead of a fixed timer, then close the gripper.
    eef_forward_fixed_duration_s: 0.0
    # If a staged arm-extension gate is enabled again later, abort instead of
    # pushing one stalled joint forever.
    eef_forward_gate_timeout_s: 25.0
    # Start final forward before the stricter close-ready threshold because
    # Servo can stall while trying to remove the last few pixels of lateral error.
    eef_forward_start_tolerance_px: 90.0
    # Final EEF advance uses a local analytic IK step on real hardware. It
    # keeps joint2/joint3/joint4 in the same trajectory point and routes joint3
    # through the raw trajectory transformer so the hardware direction stays
    # consistent.
    eef_forward_use_joint_nudge: true
    eef_forward_joint2_delta_rad: 0.040
    eef_forward_joint3_delta_rad: -0.070
    eef_forward_joint_nudge_duration_s: 0.75
    eef_forward_joint_nudge_period_s: 0.80
    # Keep this parameter for compatibility. The real final nudge now sends
    # joint2/joint3/joint4 in one trajectory point instead of using this ratio.
    eef_forward_joint3_first_duration_ratio: 0.65
    # Keep staged joint4 disabled on the real robot. The staged mode can leave
    # joint2/joint3 fixed while joint4 alone keeps pushing into the base frame.
    eef_forward_joint4_after_joint3_complete: false
    eef_forward_joint3_complete_delta_rad: 0.70
    eef_forward_joint3_complete_tolerance_rad: 0.015
    eef_forward_joint4_finish_tolerance_rad: 0.08
    eef_forward_use_analytic_ik: false
    eef_forward_use_bezier_ik: true
    eef_forward_ik_link2_x_m: 0.024
    eef_forward_ik_link2_z_m: 0.128
    eef_forward_ik_link3_m: 0.124
    eef_forward_ik_tool_m: 0.126
    eef_forward_ik_pitch_weight: 0.35
    eef_forward_ik_damping: 0.03
    eef_forward_ik_iterations: 16
    eef_forward_bezier_total_duration_s: 5.0
    eef_forward_bezier_progress_step: 0.08
    eef_forward_bezier_joint2_total_delta_rad: 3.40
    eef_forward_bezier_joint3_total_delta_rad: 0.90
    eef_forward_bezier_joint2_max_step_rad: 0.070
    eef_forward_bezier_joint3_max_step_rad: 0.090
    eef_forward_bezier_joint4_max_step_rad: 0.070
    eef_forward_bezier_preserve_roll: true
    # Additional EEF forward keeps the gripper roll, not joint4 itself.
    # Hardware observation takes priority over the model sign. Keep the
    # compensation direction opposite to the upward-looking motion, but limit
    # joint4 to a smaller correction than joint2/joint3 so the gripper does not
    # point down before the arm is fully extended.
    eef_forward_roll_joint2_weight: 1.0
    eef_forward_roll_joint3_weight: 1.0
    eef_forward_roll_joint4_weight: 0.0
    eef_forward_joint4_rpy_roll_gain: 0.0
    eef_forward_joint4_rpy_roll_max_delta_rad: 0.025
    # Cap each joint4 target step so repeated final nudge does not slowly point
    # the gripper/EEF camera toward the floor.
    eef_forward_joint4_max_delta_rad: 0.025
    # Once joint4 reaches the ground-parallel gripper/EEF-camera pose, do not
    # rotate farther in the real downward-looking direction. On the current
    # hardware, increasing joint4 during final forward nudge points the gripper
    # and EEF camera toward the floor.
    eef_forward_joint4_ground_parallel_limit_rad: -1.15
    eef_forward_joint4_ground_limit_tolerance_rad: 0.01
    eef_forward_joint4_down_positive: true
    # Extra offset is disabled; forcing joint4 past its URDF lower limit causes
    # eef_usb_camera_link/link3 collision while the real fix is joint4 direction.
    gripper_down_joint4_offset_rad: 0.0
    # During final EEF forward, distance and joint3 extension are the primary
    # close gates. Bbox shrink is kept disabled so rejected/oversized EEF bbox
    # observations cannot close the gripper early.
    close_on_front_bbox_shrink: false
    front_bbox_close_area_ratio: 0.55
    close_on_eef_bbox_shrink: false
    eef_bbox_close_area_ratio: 0.55
    eef_forward_min_advance_before_close_m: 0.04
    close_after_full_eef_forward_extension: true
    # After visual grasp confirmation, keep holding the base tracker, rotate
    # only manipulator joint1 by 180 degrees toward the follower, open the
    # gripper, then return the manipulator to the saved stay pose. Do not lift
    # joint2 during handoff because the real target is to place from the current
    # grasp height.
    handoff_after_grasp: true
    handoff_lift_joint2_delta_rad: 0.0
    handoff_place_joint2_delta_rad: 0.0
    handoff_joint_move_duration_s: 7.0
    handoff_joint_settle_s: 0.4
    handoff_republish_period_s: 0.25
    handoff_rotate_angle_rad: 1.57079633
    handoff_center_joint1_before_rotate: false
    handoff_joint1_center_target_rad: 0.0
    handoff_joint1_center_tolerance_rad: 0.03
    handoff_rotate_angular_speed_rad_s: 0.45
    handoff_release_settle_s: 0.5
    handoff_stay_joint_positions: [0.104311, 0.027612, -0.001534, -1.638291]
    triangulation_extend_x_m: 0.25
    triangulation_extend_y_m: 0.0
    triangulation_extend_z_m: 0.50
    triangulation_extend_tolerance_m: 0.02
    triangulation_extend_gain: 0.7
    triangulation_extend_max_speed: 0.017
    triangulation_min_range_m: 0.06
    triangulation_max_range_m: 1.0
    triangulation_max_ray_gap_m: 0.22
    # Measured EEF camera optical center relative to the front camera in base_link axes.
    # The EEF camera is 5 cm behind and 15 cm above the front camera.
    use_eef_front_camera_extrinsic_override: true
    eef_front_camera_offset_x_m: -0.045
    eef_front_camera_offset_y_m: 0.0
    eef_front_camera_offset_z_m: 0.16
    color_triangulation_base_stop_object_x_m: 0.22
    color_triangulation_min_object_x_m: 0.07

    gripper_open_position: 0.019
    gripper_close_position: -0.010
    gripper_max_effort: -1.0

    # Gripper joint position is derived from measured object width:
    #   joint = object_gap / 2 - gripper_finger_home_half_gap_m
    # The legacy open/close positions above are used only when width control is disabled.
    gripper_width_control_enabled: true
    gripper_fallback_object_width_m: 0.12
    gripper_finger_home_half_gap_m: 0.021
    gripper_pre_grasp_clearance_m: 0.012
    # Final grasp keeps the commanded gap slightly larger than the front-depth
    # object width; EEF RGB never updates this width estimate.
    gripper_grasp_width_scale: 1.50
    gripper_grasp_clearance_m: 0.004
    # Used only when gripper_grasp_clearance_m is 0.0.
    gripper_grasp_compression_m: 0.002
    gripper_min_position: -0.010
    gripper_max_position: 0.019
    gripper_min_measured_object_width_m: 0.01
    gripper_max_measured_object_width_m: 0.18
