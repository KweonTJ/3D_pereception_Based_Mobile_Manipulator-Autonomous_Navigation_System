csrt_ibvs_node:
  ros__parameters:
    # Track and publish debug images from the Astra color stream. Depth remains
    # a separate input used only for distance/3D control.
    image_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info_calibrated

    # A bbox message is Float32MultiArray: [x, y, width, height] in tracker image pixels.
    init_bbox_topic: /target/init_bbox
    tracked_bbox_topic: /target/tracked_bbox

    # TurtleBot3 base command.
    cmd_vel_topic: /cmd_vel
    base_hold_topic: /target/base_hold
    close_range_ready_topic: /target/close_range_ready
    stable_object_topic: /target/object_in_base
    enable_cmd_vel: true

    # Keep arm commands off until MoveIt Servo/OpenManipulator-X is configured.
    enable_arm_twist: false
    arm_twist_topic: /servo_node/delta_twist_cmds
    arm_command_frame_id: camera_color_optical_frame

    debug_image_topic: /hybrid_csrt_ibvs/debug_image
    status_topic: /hybrid_csrt_ibvs/status
    publish_debug_image: true

    # Hybrid tracking behavior.
    use_depth: true
    # Astra depth owns the base approach only until the near reliable limit.
    # Below that range, do not keep driving from bbox area; switch to front+EEF
    # color triangulation instead.
    use_area_fallback: false
    stop_when_lost: true
    allow_reverse: false
    # YOLO selects the target object, then CSRT owns the active bbox.  Continuous
    # detector updates are ignored while CSRT is tracking so a later YOLO
    # false-positive cannot replace the box target.  Do not lock the tracked
    # size to the first detector bbox; the front bbox must grow as the robot
    # approaches so area fallback and grasp-distance logic see the real scale.
    reinitialize_while_tracking: false
    accept_detector_bbox_while_tracking: true
    lock_tracked_bbox_size: true
    detector_bbox_override_timeout_s: 2.5
    min_tracked_bbox_size_ratio: 0.90
    reinit_min_iou: 0.10
    reinit_max_center_jump_ratio: 0.45
    enable_base_yaw: true
    # Once the front depth is at the near reliable limit, do not keep yawing
    # from small bbox-center errors. Close-range yaw makes the leader drift
    # left/right during manipulator work and destabilizes the follower because
    # /leader/cmd_vel relays that angular command.
    force_straight_approach: false
    loss_frame_limit: 20
    watchdog_timeout_s: 1.5
    min_bbox_size_px: 12

    # Desired target pose in image/depth space.
    desired_u_ratio: 0.5
    desired_v_ratio: 0.5
    desired_depth_m: 0.47
    desired_area_ratio: 0.12

    # Real pickup recenters the YOLO/CSRT bbox before and during approach.
    yaw_gain: 0.8
    linear_gain: 0.85
    area_gain: 1.2
    x_deadband_norm: 0.055
    y_deadband_norm: 0.035
    depth_deadband_m: 0.025
    area_deadband_ratio: 0.006
    approach_yaw_gate_norm: 0.35
    straight_approach_depth_m: 1.20
    min_forward_approach_x: 0.0
    max_linear_x: 0.08
    max_angular_z: 0.35

    # Optional OpenManipulator-X / MoveIt Servo tuning.
    arm_lateral_gain: 0.05
    arm_vertical_gain: 0.05
    arm_depth_gain: 0.03
    max_arm_linear: 0.025

    # Orbbec/Astra-style depth images are usually 16UC1 in millimeters.
    depth_roi_radius_px: 6
    depth_bbox_inner_scale: 0.70
    depth_sample_percentile: 25.0
    depth_min_valid_pixels: 5
    depth_unit_scale: 0.001
    min_valid_depth_m: 0.47
    max_valid_depth_m: 1.0
    min_depth_samples: 30
    stable_depth_frames: 3
    depth_std_max_m: 0.08
    depth_min_fill_ratio: 0.25
    depth_jump_limit_m: 0.10
    # 0.47 m is the depth-to-color-triangulation handoff point, not a stop.
    # Keep the emergency stop much closer so the base can continue with
    # triangulation until the close-range target is reached.
    emergency_stop_depth_m: 0.18
    max_depth_stamp_age_s: 1.0
    status_period_s: 0.5

    # Close-range base approach after Astra depth reaches the near reliable limit.
    use_triangulation_after_min_depth: true
    triangulation_start_depth_m: 0.47
    # If the depth ROI is already invalid near the object, enter close-range
    # color triangulation from front bbox scale instead of stopping at zero cmd.
    triangulation_start_bbox_area_ratio: 0.10
    triangulation_start_bbox_height_ratio: 0.60
    triangulation_stop_x_m: 0.20
    close_ready_bbox_height_ratio: 0.70
    close_ready_bbox_area_ratio: 0.50
    triangulation_max_speed_mps: 0.07
    triangulation_gain: 0.7
    triangulation_fallback_speed_mps: 0.02
    triangulation_fallback_max_area_ratio: 0.30
    no_depth_visual_approach_speed_mps: 0.02
    no_depth_visual_approach_max_area_ratio: 0.10
    no_depth_visual_approach_max_height_ratio: 0.60
    triangulation_timeout_s: 2.0
    triangulation_min_range_m: 0.06
    triangulation_max_range_m: 1.0
    triangulation_max_ray_gap_m: 0.08
    eef_tracked_bbox_topic: /target/eef_tracked_bbox
    eef_camera_info_topic: /eef_camera/camera_info
    use_eef_front_camera_extrinsic_override: true
    eef_front_camera_offset_x_m: -0.05
    eef_front_camera_offset_y_m: 0.0
    eef_front_camera_offset_z_m: 0.15
    use_eef_front_camera_optical_offset: false
    eef_front_camera_optical_offset_x_m: 0.0
    eef_front_camera_optical_offset_y_m: -0.15
    eef_front_camera_optical_offset_z_m: -0.05
    triangulation_flip_front_x: false
    triangulation_flip_front_y: false
    triangulation_flip_eef_x: false
    triangulation_flip_eef_y: false
    triangulation_flip_eef_z: false
